package Eliwizefraimgmail.com

import android.os.Bundle
import android.widget.Button
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity
import com.google.firebase.Firebase
import com.google.firebase.ai.GenerativeBackend
import com.google.firebase.ai.ai
import kotlinx.coroutines.MainScope
import kotlinx.coroutines.launch

class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)

        val btnGenerate = findViewById<Button>(R.id.btnGenerate)
        val tvResult = findViewById<TextView>(R.id.tvResult)

        // Sanidi model ya Gemini (kupitia Gemini Developer API ya no-cost)
        val model = Firebase.ai(backend = GenerativeBackend.googleAI())
            .generativeModel("gemini-2.5-flash")

        btnGenerate.setOnClickListener {
            tvResult.text = "Inafikiria..."
            MainScope().launch {
                try {
                    val response = model.generateContent("Andika ujumbe mzuri wa kukaribisha watumiaji kwenye programu ya Barbarians.")
                    tvResult.text = response.text
                } catch (e: Exception) {
                    tvResult.text = "Hitilafu: ${e.message}"
                }
            }
        }
    }
}
